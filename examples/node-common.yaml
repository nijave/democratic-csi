# common options for the node service

node:
  mount:
    # predominantly used to facilitate testing
    # mount_flags should generally be defined in storage classes, etc
    mount_flags: ""
    # should fsck be executed before mounting the fs
    checkFilesystem:
      xfs:
        enabled: false
        customOptions: []
      ext4:
        enabled: false
        customOptions: []
        customFilesystemOptions: []
      btrfs:
        enabled: false
        customOptions: []
        customFilesystemOptions: []
  # node-side iSCSI options
  iscsi:
    # opt-in backstop that reaps STALE iSCSI sessions, i.e. sessions whose
    # backing target no longer exists (all attached devices offline /
    # transport-offline because a prior DeleteVolume destroyed the zvol+target).
    # open-iscsi does NOT self-reap: its replacement_timeout / noop timeouts only
    # mark a broken session's devices offline and fail I/O; the session +
    # node-DB record persist until an explicit logout (+ delete). This reconciler
    # is a safety net for orphaned sessions that NodeUnstageVolume cannot clean
    # (pre-existing orphans, or leaks from paths that never reach unstage).
    #
    # Detection is conservative: a session is reaped ONLY when it has at least
    # one attached SCSI device AND every device is offline/transport-offline AND
    # none of them are currently mounted / in use. Any running or mounted device
    # leaves the session completely untouched. It is safe to run alongside
    # NodeUnstageVolume (both tolerate "already gone").
    sessionReaper:
      # off by default; must be explicitly enabled
      enabled: false
      # how often (seconds) to scan for stale sessions
      intervalSeconds: 300
      # a candidate must be observed continuously stale for at least this many
      # seconds before it is reaped (guards against transient recovery blips)
      minStaleSeconds: 120
      # delay (seconds) before the first scan after node startup
      startupDelaySeconds: 60

  format:
    xfs:
      customOptions: []
      #- -K
      # ...
    ext4:
      customOptions: []
      #- -E
      #- nodiscard
      #- m
      #- 0
      # ...
    btrfs:
      customOptions: []

  csiProxy:
    # should be left unset in most situation, will be auto-detected
    #enabled: true

    # connection attributes can be set to grpc endpoint
    # ie: hostname:port, or /some/path, or \\.\pipe\foo
    # connection and version will use internal defaults and should generally be left unset
    services:
      filesystem:
        #version: v1
        #connection:
      disk:
        #version: v1
        #connection:
      volume:
        #version: v1
        #connection:
      smb:
        #version: v1
        #connection:
      system:
        #version: v1alpha1
        #connection:
      iscsi:
        #version: v1alpha2
        #connection:
