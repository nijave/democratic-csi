# Pipeline runs on woodpecker.k8s.somemissing.info (kubernetes backend).
# Image builds go through the shared rootless buildkitd in
# k8s-manifests/vmubtkube-a/woodpecker/buildkit.woodpecker.yaml — no
# docker.sock, no privileged steps. registry.apps.nickv.me accepts
# unauthenticated pushes, so no docker_auth secret is required.
# npm lint/tests stay in GitHub Actions (its unit-tests job runs on forks).

when:
  - event: push
    branch: master
  # manual runs re-push the same SHORT_SHA tag, useful after a transient
  # registry/build failure
  - event: manual

steps:
  build-and-push:
    # renovate: datasource=docker depName=moby/buildkit
    image: moby/buildkit:v0.32.0
    environment:
      BUILDKIT_HOST: tcp://buildkitd.woodpecker.svc.cluster.local:1234
    commands:
      # matches `git rev-parse --short HEAD` (7 chars at this repo size),
      # which is the tag the vmubtkube-a deploy PRs pin
      - SHORT_SHA=$(echo "$CI_COMMIT_SHA" | cut -c1-7)
      - >-
        buildctl build
        --frontend dockerfile.v0
        --local context=.
        --local dockerfile=.
        --output "type=image,name=registry.apps.nickv.me/democratic-csi/democratic-csi:$SHORT_SHA,push=true"
